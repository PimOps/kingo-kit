services:
  n8n:
    container_name: kingo-n8n
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.30.5}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: kingo-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: kingo
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
      QDRANT_URL: http://kingo-qdrant:6333
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ${KINGOKIT_SHARED_DIR:?Set KINGOKIT_SHARED_DIR}:/home/node/kingokit
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      kingo-n8n:
        aliases: [kingo-n8n]

volumes:
  n8n-data:
    name: ${COMPOSE_PROJECT_NAME:-kingo-kit}_n8n-data

networks:
  kingo-n8n:
    name: kingo-kit
    external: true
