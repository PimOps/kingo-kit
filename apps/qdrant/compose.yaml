services:
  qdrant:
    container_name: kingo-qdrant
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      kingo-qdrant:
        # Keep the former generic alias for existing saved app connections.
        aliases: [kingo-qdrant, qdrant]

volumes:
  qdrant-storage:
    name: ${COMPOSE_PROJECT_NAME:-kingo-kit}_qdrant-storage

networks:
  kingo-qdrant:
    name: kingo-kit
    external: true
