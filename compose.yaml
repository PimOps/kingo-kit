name: ${COMPOSE_PROJECT_NAME:-kingo-kit}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-kingo-kit-postgres:pg17}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: kingo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LANGFLOW_DB_PASSWORD: ${LANGFLOW_DB_PASSWORD}
      LANGGRAPH_DB_PASSWORD: ${LANGGRAPH_DB_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
      CLOUDBEAVER_DB_PASSWORD: ${CLOUDBEAVER_DB_PASSWORD}
      JUPYTER_DB_PASSWORD: ${JUPYTER_DB_PASSWORD}
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kingo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [kingo]

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
      args:
        JUPYTER_BASE_IMAGE: ${JUPYTER_BASE_IMAGE:-quay.io/jupyter/minimal-notebook:python-3.12}
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: warehouse
      PGUSER: jupyter
      PGPASSWORD: ${JUPYTER_DB_PASSWORD}
      DATABASE_URL: postgresql+psycopg://jupyter:${JUPYTER_DB_PASSWORD}@postgres:5432/warehouse
    command:
      - start-notebook.py
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.password=
      - --ServerApp.allow_origin=*
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - jupyter-home:/home/jovyan/.jupyter
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kingo]

  langflow:
    image: ${LANGFLOW_IMAGE:-langflowai/langflow:1.9.2}
    restart: unless-stopped
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: 7860
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      LANGFLOW_DATABASE_URL: postgresql://langflow:${LANGFLOW_DB_PASSWORD}@postgres:5432/kingo?options=-csearch_path%3Dlangflow
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SUPERUSER: kingo
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SECRET_KEY}
      LANGFLOW_NEW_USER_IS_ACTIVE: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - langflow-data:/app/langflow
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kingo]

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.30.5}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: kingo
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kingo]

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.61.9}
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_CONNECTION_URI: jdbc:postgresql://postgres:5432/kingo?currentSchema=metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_SITE_NAME: SKKU Kingo Kit
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: ${TZ:-Asia/Seoul}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [kingo]

  metabase-init:
    image: curlimages/curl:8.16.0
    restart: "no"
    environment:
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - ./docker/metabase/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      metabase:
        condition: service_healthy
    networks: [kingo]

  cloudbeaver:
    image: ${CLOUDBEAVER_IMAGE:-dbeaver/cloudbeaver:26.0.5}
    restart: unless-stopped
    environment:
      CB_SERVER_NAME: SKKU Kingo Kit
      CB_SERVER_URL: http://localhost:${CLOUDBEAVER_PORT:-8978}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN_USER:-kingo}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD}
      CLOUDBEAVER_APP_SUPPORTS_CUSTOM_CONNECTIONS: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kingo]

  adventureworks-source:
    image: ${ADVENTUREWORKS_IMAGE:-chriseaton/adventureworks:postgres-16}
    profiles: [samples]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [kingo]

  sample-loader:
    build:
      context: .
      dockerfile: docker/sample-loader/Dockerfile
    profiles: [samples]
    environment:
      TARGET_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/warehouse
      ADVENTUREWORKS_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@adventureworks-source:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
      adventureworks-source:
        condition: service_healthy
    networks: [kingo]

volumes:
  postgres-data:
  jupyter-home:
  langflow-data:
  n8n-data:
  cloudbeaver-workspace:

networks:
  kingo:
    name: kingo-kit
