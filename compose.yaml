name: ${COMPOSE_PROJECT_NAME:-kingo-kit}

# This is the convenient whole-stack entry point. Every included application
# also has a standalone Compose file under apps/ for focused development,
# upgrades, and classroom troubleshooting.
include:
  - path: apps/postgres/compose.yaml
    env_file: .env
  - path: apps/jupyter/compose.yaml
    env_file: .env
  - path: apps/langflow/compose.yaml
    env_file: .env
  - path: apps/n8n/compose.yaml
    env_file: .env
  - path: apps/metabase/compose.yaml
    env_file: .env
  - path: apps/cloudbeaver/compose.yaml
    env_file: .env
  - path: apps/qdrant/compose.yaml
    env_file: .env
  - path: apps/sample-data/compose.yaml
    env_file: .env
